name: Build School Transport Fare Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -print -quit)
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDK Manager found: $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Firebase configuration
        run: |
          echo "Checking app folder..."
          ls -la app
          echo "Checking tracked file..."
          git ls-files app/google-services.json
          test -f app/google-services.json
          
      - name: Validate Android Manifest
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('Manifest XML is valid')"

      - name: Inspect repository files
        run: |
          pwd
          git ls-files | grep -i 'ic_launcher\|AndroidManifest.xml'
          ls -la app/src/main
    
      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Transport-Fare-Manager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
